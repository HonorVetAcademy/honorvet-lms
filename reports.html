<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — HonorVet Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo-icon.png">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img class="logo-mark" src="assets/logo-icon.png" alt="HonorVet Technologies">
      <div class="logo-text-wrap">
        <div class="logo-text" id="app-name">HonorVet Academy</div>
        <div class="logo-sub">Learning Platform</div>
      </div>
    </div>
    <nav class="nav-section"><div class="nav-label">Menu</div><div id="nav-links"></div></nav>
    <div class="sidebar-footer"><div class="user-chip" id="user-chip"></div></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title">Reports</div>
        <div class="topbar-sub">Training completion and compliance overview</div>
      </div>
      <div class="topbar-actions" style="display:flex;align-items:center;gap:10px">
        <div class="topbar-search">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="report-search" placeholder="Filter rows…" oninput="filterReportRows()">
        </div>
        <div id="notif-bell-wrap"></div>
        <button class="btn btn-secondary" onclick="exportCSV()">⬇ Export CSV</button>
      </div>
    </header>

    <div class="page">
      <!-- Summary stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="s-users">—</div></div>
        <div class="stat-card"><div class="stat-label">Total Courses</div><div class="stat-value" id="s-courses">—</div></div>
        <div class="stat-card"><div class="stat-label">Completions</div><div class="stat-value" id="s-completed">—</div></div>
        <div class="stat-card"><div class="stat-label">Compliance Rate</div><div class="stat-value" id="s-compliance">—</div><div class="stat-sub">mandatory courses</div></div>
      </div>

      <!-- Tabs -->
      <div id="tabs-wrap">
        <div class="tabs">
          <button class="tab-btn active" data-tab="tab-full" onclick="switchTab(this)">Full Report</button>
          <button class="tab-btn" data-tab="tab-completion" onclick="switchTab(this)">By Employee</button>
          <button class="tab-btn" data-tab="tab-courses" onclick="switchTab(this)">By Course</button>
          <button class="tab-btn" data-tab="tab-assignments" onclick="switchTab(this)">Assignments</button>
          <button class="tab-btn" data-tab="tab-compliance" onclick="switchTab(this)">Compliance</button>
        </div>

        <!-- Full Report: one row per assignment with assigner, timing, and
             quiz score/wrong-question detail — the single comprehensive view. -->
        <div id="tab-full">
          <div class="table-wrap" id="full-report-wrap"><div class="spinner"></div></div>
        </div>

        <!-- By Employee -->
        <div id="tab-completion" style="display:none">
          <div class="table-wrap" id="user-table-wrap"><div class="spinner"></div></div>
        </div>

        <!-- By Course -->
        <div id="tab-courses" style="display:none">
          <div class="table-wrap" id="course-table-wrap"><div class="spinner"></div></div>
        </div>

        <!-- Assignments: one row per course assignment, with assigned/completed timestamps -->
        <div id="tab-assignments" style="display:none">
          <div class="table-wrap" id="assignments-table-wrap"><div class="spinner"></div></div>
        </div>

        <!-- Compliance -->
        <div id="tab-compliance" style="display:none">
          <div id="compliance-area"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('app-name').textContent = APP_CONFIG.appName;

let allEnrollments = [], allUsers = [], allCourses = [], allQuizAttempts = [], allQuizQuestions = [], quizSummaries = {};

// Groups every quiz attempt by user, then reduces to each course's latest
// attempt (highest attempt_number) so retries don't get double-counted.
function buildQuizSummaries(attempts) {
  const byUser = {};
  attempts.forEach(a => { (byUser[a.user_id] = byUser[a.user_id] || []).push(a); });
  const summaries = {};
  for (const [uid, atts] of Object.entries(byUser)) {
    const byCourse = {};
    atts.forEach(a => {
      if (!byCourse[a.course_id] || a.attempt_number > byCourse[a.course_id].attempt_number) byCourse[a.course_id] = a;
    });
    const latest = Object.values(byCourse);
    const passed = latest.filter(a => a.passed).length;
    const avg = latest.length ? Math.round(latest.reduce((s, a) => s + a.score, 0) / latest.length) : 0;
    summaries[uid] = { taken: latest.length, passed, avg, byCourse };
  }
  return summaries;
}

function switchTab(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('#tabs-wrap > div[id^="tab-"]').forEach(p => p.style.display = 'none');
  btn.classList.add('active');
  document.getElementById(btn.dataset.tab).style.display = '';
  filterReportRows();
}

// Live filter across the visible tab's table rows / compliance cards
function filterReportRows() {
  const q = (document.getElementById('report-search')?.value || '').toLowerCase();
  document.querySelectorAll('#tabs-wrap table tbody tr').forEach(tr => {
    tr.style.display = (!q || tr.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('#compliance-area .card').forEach(card => {
    card.style.display = (!q || card.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

(async () => {
  const user = await requireAuth();
  if (!user) return;
  if (!['admin','hr','manager'].includes(user.role)) { location.href = 'dashboard.html'; return; }
  renderNav('reports', user);
  renderNotifBell(user.id, 'notif-bell-wrap');
  renderUserChip(user);

  [allEnrollments, allUsers, allCourses, allQuizAttempts, allQuizQuestions] = await Promise.all([
    Enrollments.getAll(),
    Users.getAll(),
    Courses.getAll(),
    Quiz.getAllAttempts(),
    Quiz.getAllQuestions(),
  ]);
  quizSummaries = buildQuizSummaries(allQuizAttempts);

  // Stats
  const completed    = allEnrollments.filter(e => e.status === 'completed').length;
  const mandatory    = allCourses.filter(c => c.is_mandatory);
  const mandEnr      = allEnrollments.filter(e => mandatory.some(m => m.id === e.course_id));
  const compliance   = mandEnr.length ? Math.round(mandEnr.filter(e => e.status==='completed').length / mandEnr.length * 100) : 100;
  document.getElementById('s-users').textContent      = allUsers.length;
  document.getElementById('s-courses').textContent    = allCourses.length;
  document.getElementById('s-completed').textContent  = completed;
  document.getElementById('s-compliance').textContent = compliance + '%';

  renderFullReportTable();
  renderUserTable();
  renderCourseTable();
  renderAssignmentsTable();
  renderCompliance();
})();

// ── Full Report ──────────────────────────────────────────────
// Pulls the latest quiz attempt for a user+course (same "latest wins"
// logic buildQuizSummaries uses) so retries don't get double-counted.
function getLatestAttempt(userId, courseId) {
  return quizSummaries[userId]?.byCourse?.[courseId] || null;
}

// Cross-references the latest attempt's raw selected-option answers
// against each question's correct_answers to find exactly which
// questions were missed (quiz_attempts only stores what was selected,
// not a per-question correct/incorrect flag).
function computeScoreDetail(userId, courseId) {
  const attempt = getLatestAttempt(userId, courseId);
  if (!attempt) return null;
  const questions = allQuizQuestions.filter(q => q.course_id === courseId);
  const optionLabels = (q, indexes) => indexes.length
    ? indexes.map(i => q.options?.[i]).filter(v => v != null).join('; ')
    : '(no answer selected)';
  const wrongQuestions = questions.filter(q => {
    const selected = (attempt.answers && attempt.answers[q.id]) || [];
    const correct  = q.correct_answers || [];
    return JSON.stringify([...selected].sort()) !== JSON.stringify([...correct].sort());
  }).map(q => {
    const selected = (attempt.answers && attempt.answers[q.id]) || [];
    const correct  = q.correct_answers || [];
    return { ...q, theirAnswer: optionLabels(q, selected), correctAnswer: optionLabels(q, correct) };
  });
  return {
    score: attempt.score, passed: attempt.passed, attemptNumber: attempt.attempt_number,
    total: questions.length, correct: questions.length - wrongQuestions.length,
    wrongQuestions,
  };
}

function fmtDuration(ms) {
  if (ms == null || ms < 0) return '—';
  const mins = Math.round(ms / 60000);
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ${mins % 60}m`;
  const days = Math.floor(hrs / 24);
  return `${days}d ${hrs % 24}h`;
}

function toggleWrongAnswers(rowId) {
  const el = document.getElementById(rowId);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

function renderFullReportTable() {
  const rows = [...allEnrollments].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  if (!rows.length) {
    document.getElementById('full-report-wrap').innerHTML = '<div class="empty-state"><p>No assignments yet.</p></div>';
    return;
  }
  document.getElementById('full-report-wrap').innerHTML = `<table>
    <thead><tr>
      <th>Employee</th><th>Course</th><th>Assigned By</th><th>Assigned On</th>
      <th>Completed On</th><th>Time Taken</th><th>Score</th><th>Status</th><th></th>
    </tr></thead>
    <tbody>${rows.map((e, i) => {
      const u = e.users || allUsers.find(u2 => u2.id === e.user_id) || {};
      const c = allCourses.find(c2 => c2.id === e.course_id);
      const courseLabel = c ? `${c.icon || '📖'} ${c.title}` : `<span style="color:var(--danger)">⚠ Deleted course</span>`;
      const assigner = e.assigned_by ? allUsers.find(u2 => u2.id === e.assigned_by) : null;
      const assignedByLabel = assigner ? (assigner.name || assigner.email) : '<span style="color:var(--text-dim)">—</span>';
      const detail = computeScoreDetail(e.user_id, e.course_id);
      const scoreLabel = detail ? `${detail.correct}/${detail.total} · ${detail.score}%${detail.passed ? '' : ' ⚠'}` : '—';
      const timeTaken = (e.completed_at && e.created_at) ? fmtDuration(new Date(e.completed_at) - new Date(e.created_at)) : '—';
      const rowId = `fr-${i}`;
      const wrongCount = detail ? detail.wrongQuestions.length : 0;
      const toggleCell = wrongCount
        ? `<button class="btn btn-ghost btn-sm" onclick="toggleWrongAnswers('${rowId}')">View ${wrongCount} wrong</button>`
        : (detail ? '<span style="color:var(--text-dim);font-size:12px">All correct</span>' : '');
      const detailRow = wrongCount
        ? `<tr id="${rowId}" style="display:none"><td colspan="9" style="background:var(--bg-alt,#f8f8f8)">
             <div style="padding:10px 6px"><strong style="font-size:12.5px">Missed questions (attempt ${detail.attemptNumber}):</strong>
               <ol style="margin:8px 0 0;padding-left:20px;font-size:12.5px;color:var(--text-muted)">
                 ${detail.wrongQuestions.map(q => `<li style="margin-bottom:10px">
                   <div style="color:var(--text-strong,#111)">${escHtml(q.question_text)}</div>
                   <div style="margin-top:2px"><span style="color:var(--danger)">Their answer:</span> ${escHtml(q.theirAnswer)}</div>
                   <div><span style="color:var(--success)">Correct answer:</span> ${escHtml(q.correctAnswer)}</div>
                 </li>`).join('')}
               </ol>
             </div>
           </td></tr>`
        : '';
      return `<tr>
        <td><strong>${u.name || '—'}</strong><div style="font-size:11.5px;color:var(--text-muted)">${u.email || ''}</div></td>
        <td>${courseLabel}</td>
        <td style="color:var(--text-muted)">${assignedByLabel}</td>
        <td style="color:var(--text-muted);white-space:nowrap">${fmtDateTime(e.created_at)}</td>
        <td style="color:var(--text-muted);white-space:nowrap">${e.completed_at ? fmtDateTime(e.completed_at) : '—'}</td>
        <td style="color:var(--text-muted)">${timeTaken}</td>
        <td>${scoreLabel}</td>
        <td>${statusBadge(e.status)}</td>
        <td>${toggleCell}</td>
      </tr>${detailRow}`;
    }).join('')}</tbody>
  </table>`;
}

function renderUserTable() {
  // Group enrollments by user
  const byUser = {};
  for (const e of allEnrollments) {
    if (!byUser[e.user_id]) {
      const u = allUsers.find(u => u.id === e.user_id) || e.users || {};
      byUser[e.user_id] = { id: e.user_id, name: u.name||'—', email: u.email||'—', role: u.role||'—', dept: u.department||'—', total:0, done:0 };
    }
    byUser[e.user_id].total++;
    if (e.status==='completed') byUser[e.user_id].done++;
  }
  const rows = Object.values(byUser).sort((a,b) => b.done/Math.max(b.total,1) - a.done/Math.max(a.total,1));

  if (!rows.length) {
    document.getElementById('user-table-wrap').innerHTML = '<div class="empty-state"><p>No enrollment data yet.</p></div>';
    return;
  }
  document.getElementById('user-table-wrap').innerHTML = `<table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Assigned</th><th>Completed</th><th>Progress</th><th>Quiz Scores</th></tr></thead>
    <tbody>${rows.map(r => {
      const pct = r.total ? Math.round(r.done/r.total*100) : 0;
      const qs  = quizSummaries[r.id];
      return `<tr>
        <td><strong>${r.name}</strong></td>
        <td style="color:var(--text-muted)">${r.email}</td>
        <td>${roleBadge(r.role)}</td>
        <td style="color:var(--text-muted)">${r.dept}</td>
        <td style="color:var(--text-muted)">${r.total}</td>
        <td style="color:var(--text-muted)">${r.done}</td>
        <td style="min-width:120px">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="progress-bar" style="flex:1"><div class="progress-fill ${pct===100?'done':''}" style="width:${pct}%"></div></div>
            <span style="font-size:12px;color:var(--text-muted);white-space:nowrap">${pct}%</span>
          </div>
        </td>
        <td style="color:var(--text-muted);font-size:12.5px">${qs ? `${qs.passed}/${qs.taken} passed · avg ${qs.avg}%` : '—'}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderCourseTable() {
  const rows = allCourses.map(c => {
    const enrs   = allEnrollments.filter(e => e.course_id === c.id);
    const done   = enrs.filter(e => e.status==='completed').length;
    const active = enrs.filter(e => e.status==='in_progress').length;
    const pct    = enrs.length ? Math.round(done/enrs.length*100) : 0;
    return { ...c, enrolled: enrs.length, done, active, pct };
  }).sort((a,b) => b.enrolled - a.enrolled);

  if (!rows.length) {
    document.getElementById('course-table-wrap').innerHTML = '<div class="empty-state"><p>No courses yet.</p></div>';
    return;
  }
  document.getElementById('course-table-wrap').innerHTML = `<table>
    <thead><tr><th>Course</th><th>Mandatory</th><th>Enrolled</th><th>In Progress</th><th>Completed</th><th>Completion Rate</th></tr></thead>
    <tbody>${rows.map(c => `<tr>
      <td><strong>${c.icon||'📖'} ${c.title}</strong></td>
      <td>${c.is_mandatory ? '<span class="badge badge-red">Yes</span>' : '<span class="badge badge-gray">No</span>'}</td>
      <td>${c.enrolled}</td>
      <td style="color:var(--text-muted)">${c.active}</td>
      <td style="color:var(--success)">${c.done}</td>
      <td style="min-width:130px">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="progress-bar" style="flex:1"><div class="progress-fill ${c.pct===100?'done':''}" style="width:${c.pct}%"></div></div>
          <span style="font-size:12px;color:var(--text-muted)">${c.pct}%</span>
        </div>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// One row per assignment: who, which course, when assigned, when
// completed, current status/progress.
function renderAssignmentsTable() {
  const rows = [...allEnrollments].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  if (!rows.length) {
    document.getElementById('assignments-table-wrap').innerHTML = '<div class="empty-state"><p>No assignments yet.</p></div>';
    return;
  }
  document.getElementById('assignments-table-wrap').innerHTML = `<table>
    <thead><tr><th>Employee</th><th>Course</th><th>Assigned On</th><th>Status</th><th>Progress</th><th>Completed On</th><th></th></tr></thead>
    <tbody>${rows.map(e => {
      const u = e.users || allUsers.find(u => u.id === e.user_id) || {};
      const c = allCourses.find(c => c.id === e.course_id);
      const courseLabel = c ? `${c.icon || '📖'} ${c.title}` : `<span style="color:var(--danger)">⚠ Deleted course</span> <span style="color:var(--text-dim);font-size:11px">(${e.course_id})</span>`;
      const label = `${u.name || u.email || 'this user'} — ${c ? c.title : e.course_id}`;
      return `<tr>
        <td><strong>${u.name || '—'}</strong><div style="font-size:11.5px;color:var(--text-muted)">${u.email || ''}</div></td>
        <td>${courseLabel}</td>
        <td style="color:var(--text-muted);white-space:nowrap">${fmtDateTime(e.created_at)}</td>
        <td>${statusBadge(e.status)}</td>
        <td style="color:var(--text-muted)">${e.progress || 0}%</td>
        <td style="color:var(--text-muted);white-space:nowrap">${e.completed_at ? fmtDateTime(e.completed_at) : '—'}</td>
        <td><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="removeAssignment('${e.user_id}','${e.course_id}','${escHtml(label).replace(/'/g, "&#39;")}')">Remove</button></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

async function removeAssignment(userId, courseId, label) {
  if (!confirm(`Remove "${label}"? Progress will be lost.`)) return;
  try {
    await Enrollments.unassign(userId, courseId);
    allEnrollments = allEnrollments.filter(e => !(e.user_id === userId && e.course_id === courseId));
    renderFullReportTable();
    renderUserTable();
    renderCourseTable();
    renderAssignmentsTable();
    toast('Removed.', 'success');
  } catch (e) { toast(e.message, 'error'); }
}

function renderCompliance() {
  const mandatory = allCourses.filter(c => c.is_mandatory);
  if (!mandatory.length) {
    document.getElementById('compliance-area').innerHTML = '<div class="empty-state"><p>No mandatory courses defined yet.<br>Mark a course as mandatory to see compliance data.</p></div>';
    return;
  }
  const cards = mandatory.map(c => {
    const enrs = allEnrollments.filter(e => e.course_id === c.id);
    const done = enrs.filter(e => e.status==='completed').length;
    const pct  = allUsers.length ? Math.round(done/allUsers.length*100) : 0;
    const color = pct >= 90 ? 'var(--success)' : pct >= 60 ? '#d97706' : 'var(--danger)';
    return `<div class="card card-body" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div><span style="font-size:20px;margin-right:8px">${c.icon||'📖'}</span><strong>${c.title}</strong></div>
        <span style="font-size:22px;font-weight:800;color:${color}">${pct}%</span>
      </div>
      <div class="progress-bar" style="height:8px"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
      <div style="margin-top:8px;font-size:12.5px;color:var(--text-muted)">${done} of ${allUsers.length} employees completed</div>
    </div>`;
  });
  document.getElementById('compliance-area').innerHTML = cards.join('');
}

function exportCSV() {
  const byUser = {};
  for (const e of allEnrollments) {
    const u = allUsers.find(u => u.id === e.user_id) || {};
    const c = allCourses.find(c => c.id === e.course_id) || {};
    const assigner = e.assigned_by ? allUsers.find(u2 => u2.id === e.assigned_by) : null;
    const detail = computeScoreDetail(e.user_id, e.course_id);
    const timeTaken = (e.completed_at && e.created_at) ? fmtDuration(new Date(e.completed_at) - new Date(e.created_at)) : '';
    byUser[e.user_id + '_' + e.course_id] = {
      name: u.name||'', email: u.email||'', role: u.role||'', department: u.department||'',
      course: c.title||e.course_id, mandatory: c.is_mandatory ? 'Yes':'No',
      assignedBy: assigner ? (assigner.name || assigner.email) : '',
      status: e.status, assignedAt: e.created_at||'', completedAt: e.completed_at||'', timeTaken,
      quizScore: detail ? detail.score + '%' : '',
      quizCorrect: detail ? `${detail.correct}/${detail.total}` : '',
      quizPassed: detail ? (detail.passed ? 'Yes' : 'No') : '',
      quizAttempts: detail ? detail.attemptNumber : '',
      wrongQuestions: detail ? detail.wrongQuestions.map(q => `${q.question_text} [answered: ${q.theirAnswer}; correct: ${q.correctAnswer}]`).join(' | ') : '',
    };
  }
  const rows = Object.values(byUser);
  const header = 'Name,Email,Role,Department,Course,Mandatory,Assigned By,Status,Assigned At,Completed At,Time Taken,Quiz Score,Correct/Total,Quiz Passed,Quiz Attempts,Wrong Questions (with their answer and correct answer)';
  const csv = [header, ...rows.map(r =>
    [r.name,r.email,r.role,r.department,r.course,r.mandatory,r.assignedBy,r.status,r.assignedAt,r.completedAt,r.timeTaken,r.quizScore,r.quizCorrect,r.quizPassed,r.quizAttempts,r.wrongQuestions]
      .map(v => `"${String(v).replace(/"/g,'""')}"`)
      .join(',')
  )].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = `lms-report-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('Report exported!', 'success');
}
</script>
</body>
</html>
