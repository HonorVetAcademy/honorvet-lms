<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password — HonorVet Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo-icon.png">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img class="logo-mark" src="assets/logo-icon.png" alt="HonorVet Technologies">
      <div>
        <div class="org-name" id="org-name">HonorVet Academy</div>
        <div style="font-size:12px;color:var(--text-muted)">Learning Management System</div>
      </div>
    </div>

    <h2 class="login-title" id="cp-title">Set your password</h2>
    <p class="login-sub" id="cp-sub">Choose a new password to continue.</p>

    <div id="alert-area"></div>

    <form id="cp-form">
      <div class="form-group">
        <label class="form-label" for="cp-new">New password</label>
        <input class="form-input" type="password" id="cp-new" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="cp-confirm">Confirm password</label>
        <input class="form-input" type="password" id="cp-confirm" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" id="cp-btn">
        Set password
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('org-name').textContent = APP_CONFIG.appName;
document.title = 'Set Your Password — ' + APP_CONFIG.appName;

let cpUser = null;

(async () => {
  // Supabase auto-detects a recovery session from the URL hash on client
  // init, so this covers both the "forgot password" email link and a
  // forced first-time change after a normal sign-in.
  const session = await Auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  cpUser = await Users.getCurrent();
  if (cpUser?.must_change_password) {
    document.getElementById('cp-sub').textContent = 'Your account was created with a temporary password. Set your own to continue.';
  }
})();

document.getElementById('cp-form').onsubmit = async (e) => {
  e.preventDefault();
  const alertArea = document.getElementById('alert-area');
  alertArea.innerHTML = '';
  const pass    = document.getElementById('cp-new').value;
  const confirm = document.getElementById('cp-confirm').value;
  if (pass !== confirm) {
    alertArea.innerHTML = '<div class="alert alert-error">Passwords don\'t match.</div>';
    return;
  }
  const btn = document.getElementById('cp-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await Auth.updatePassword(pass);
    if (cpUser?.id) await Users.clearMustChangePassword(cpUser.id);
    toast('Password updated!', 'success');
    window.location.href = 'dashboard.html';
  } catch (err) {
    alertArea.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Set password';
  }
};
</script>
</body>
</html>
