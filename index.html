<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HonorVet Academy — Sign In</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo-icon.png">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img class="logo-mark" src="assets/logo-icon.png" alt="HonorVet Technologies">
      <div>
        <div class="org-name" id="org-name">HonorVet Academy</div>
        <div style="font-size:12px;color:var(--text-muted)">Learning Management System</div>
      </div>
    </div>

    <h2 class="login-title">Welcome back</h2>
    <p class="login-sub">Sign in to access your training</p>

    <div id="alert-area"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@honorvet.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div style="text-align:right;margin:-8px 0 14px">
        <a href="#" style="font-size:12.5px;color:var(--brand)" onclick="showForgotPassword();return false;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" id="signin-btn">
        Sign in
      </button>
    </form>

    <p style="font-size:12px;color:var(--text-dim);text-align:center;margin-top:16px;">
      Need help? Contact <a href="mailto:Tanya.Awasthi@HonorVet.com" style="color:var(--brand)">Tanya.Awasthi@HonorVet.com</a>
    </p>
  </div>
</div>

<!-- Forgot password modal -->
<div class="modal-overlay" id="forgot-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Reset your password</span>
      <button class="modal-close" onclick="closeModal('forgot-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <div id="forgot-alert"></div>
      <p style="font-size:13px;color:var(--text-muted);margin:0 0 14px">Enter your account email and we'll send you a link to set a new password.</p>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input class="form-input" type="email" id="forgot-email" placeholder="you@honorvet.com" required>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('forgot-modal')">Cancel</button>
      <button class="btn btn-primary" id="forgot-btn" onclick="doForgotPassword()">Send reset link</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
// Apply branding
document.getElementById('org-name').textContent = APP_CONFIG.appName;
document.title = APP_CONFIG.appName + ' — Sign In';

// Surface any auth error redirected back via URL hash (e.g. an expired or
// already-used password reset link) instead of silently showing the login form.
(() => {
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('error')) {
    const desc = (hash.get('error_description') || '').replace(/\+/g, ' ');
    document.getElementById('alert-area').innerHTML =
      `<div class="alert alert-error">${desc || 'That link is invalid or has expired.'} Request a new one below.</div>`;
    history.replaceState(null, '', location.pathname);
  }
})();

// If already logged in, go to dashboard
(async () => {
  const session = await Auth.getSession();
  if (session) window.location.href = 'dashboard.html';
})();

document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signin-btn');
  const alertArea = document.getElementById('alert-area');
  alertArea.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    await Auth.signIn(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );
    const profile = await Users.getCurrent();
    window.location.href = profile?.must_change_password ? 'change-password.html' : 'dashboard.html';
  } catch (err) {
    alertArea.innerHTML = `<div class="alert alert-error">${err.message || 'Sign-in failed. Check your email and password.'}</div>`;
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
};

function showForgotPassword() {
  document.getElementById('forgot-alert').innerHTML = '';
  document.getElementById('forgot-email').value = document.getElementById('email').value.trim();
  openModal('forgot-modal');
}

async function doForgotPassword() {
  const btn = document.getElementById('forgot-btn');
  const alertArea = document.getElementById('forgot-alert');
  const email = document.getElementById('forgot-email').value.trim();
  if (!email) { alertArea.innerHTML = '<div class="alert alert-error">Enter your email address.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await Auth.sendPasswordReset(email);
    alertArea.innerHTML = '<div class="alert alert-success">If that email has an account, a reset link is on its way. Check your inbox.</div>';
    btn.textContent = 'Sent ✓';
  } catch (err) {
    alertArea.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
}

</script>
</body>
</html>
