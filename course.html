<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course — HonorVet Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo-icon.png">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img class="logo-mark" src="assets/logo-icon.png" alt="HonorVet Technologies">
      <div class="logo-text-wrap">
        <div class="logo-text" id="app-name">HonorVet Academy</div>
        <div class="logo-sub">Learning Platform</div>
      </div>
    </div>
    <nav class="nav-section"><div class="nav-label">Menu</div><div id="nav-links"></div></nav>
    <div class="sidebar-footer"><div class="user-chip" id="user-chip"></div></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <a href="catalog.html" class="btn btn-secondary btn-sm">← Back to catalog</a>
      </div>
      <div id="notif-bell-wrap"></div>
    </header>

    <div class="page">
      <!-- Course hero banner -->
      <div class="course-hero" id="course-hero">
        <div class="course-hero-eyebrow" id="ch-cat">Training</div>
        <h1 class="course-hero-title" id="course-title">Loading…</h1>
        <div class="course-hero-meta" id="course-meta"></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start" id="layout">
        <div>
          <div class="player-wrap" id="player-wrap">
            <div class="spinner"></div>
          </div>
          <div id="quiz-main-section" style="display:none;margin-top:20px"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:16px">
          <!-- Progress card -->
          <div class="card card-body" id="progress-card">
            <div class="card-title">Your Progress</div>
            <div style="margin:12px 0">
              <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:6px" id="progress-label">Not started</div>
            </div>

            <!-- Shown only when this course has no quiz questions set up yet -->
            <div id="no-quiz-msg" style="display:none;font-size:12.5px;color:var(--text-muted);text-align:center;padding:8px 0">
              This course doesn't have an assessment yet. Check back later, or contact your administrator.
            </div>

            <!-- Quiz flow: used whenever the course has quiz questions -->
            <div id="quiz-summary" style="display:none">
              <div id="quiz-summary-text" style="font-size:12.5px;color:var(--text-muted);margin-bottom:12px"></div>
              <button class="btn btn-primary" style="width:100%;justify-content:center" id="quiz-start-btn" onclick="scrollToQuiz()">Start Quiz</button>
            </div>

            <div id="completed-msg" style="display:none;text-align:center;padding:10px 0">
              <div style="color:var(--success);font-size:13px;font-weight:600">✓ Completed</div>
              <div id="completed-date" style="font-size:11.5px;color:var(--text-muted);margin-top:2px"></div>
            </div>
          </div>

          <!-- Certificate card (shown after completion) -->
          <div class="card card-body" id="cert-card" style="display:none">
            <div class="card-title">Certificate</div>
            <div style="margin-top:10px;font-size:13px;color:var(--text-muted)">
              You earned a certificate for this course.
            </div>
            <button class="btn btn-secondary btn-sm" style="margin-top:10px;width:100%;justify-content:center" onclick="downloadCertificate()">
              Download Certificate
            </button>
          </div>

          <!-- Course info -->
          <div class="card card-body" id="info-card">
            <div class="card-title">About this course</div>
            <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--text-muted)" id="course-info-rows"></div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('app-name').textContent = APP_CONFIG.appName;

const params    = new URLSearchParams(location.search);
const courseId  = params.get('id');
let currentUser = null, enrollment = null, course = null;

(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;
  renderNav('catalog', currentUser);
  renderUserChip(currentUser);
  renderNotifBell(currentUser.id, 'notif-bell-wrap');

  if (!courseId) { location.href = 'catalog.html'; return; }
  course = await Courses.getById(courseId);
  if (!course) { location.href = 'catalog.html'; return; }

  document.title = course.title + ' — HonorVet Academy';
  document.getElementById('course-title').textContent = course.title;
  initAIChatWidget({ userName: currentUser.name, userRole: currentUser.role, courseTitle: course.title, courseDescription: course.description });
  document.getElementById('ch-cat').textContent = (course.tags && course.tags[0]) || 'Training';
  const heroCover = resolveCoverImage(course);
  const heroEl = document.getElementById('course-hero');
  if (heroCover) {
    heroEl.style.background = `linear-gradient(rgba(35,31,32,.55), rgba(35,31,32,.55)), url('${heroCover}') center/cover`;
  } else {
    heroEl.style.background = courseGradient(course);
  }
  document.getElementById('course-meta').innerHTML =
    `<span class="chm">${clockIcon()} ${course.duration_minutes || '?'} min</span>` +
    `<span class="chm">${course.icon || '📖'} ${contentTypeLabel(course.content_type)}</span>` +
    (course.is_mandatory ? `<span class="chm chm-mand">⚠ Mandatory</span>` : '');

  try { await Enrollments.enroll(currentUser.id, courseId); } catch {}

  const enrs = await Enrollments.getMine(currentUser.id);
  enrollment  = enrs.find(e => e.course_id === courseId);

  updateProgressUI();

  document.getElementById('course-info-rows').innerHTML = `
    <div><strong>Duration:</strong> ${course.duration_minutes || '?'} minutes</div>
    <div><strong>Type:</strong> ${contentTypeLabel(course.content_type)}</div>
    ${course.is_mandatory ? '<div style="color:var(--danger)"><strong>⚠ Mandatory training</strong></div>' : ''}
    ${course.created_at ? `<div><strong>Added:</strong> ${fmtDate(course.created_at)}</div>` : ''}
  `;

  await renderPlayer(course);

  if (enrollment?.status === 'not_started') {
    await Enrollments.updateProgress(currentUser.id, courseId, 'in_progress', 10);
    enrollment.status   = 'in_progress';
    enrollment.progress = 10;
    updateProgressUI();
  }

  // Every course is completed via its quiz; show a placeholder if one
  // hasn't been set up for this course yet.
  if (enrollment?.status !== 'completed') {
    quizQuestions = await Quiz.getQuestions(courseId);
    if (quizQuestions.length > 0) {
      await initQuizFlow();
    } else {
      document.getElementById('no-quiz-msg').style.display = '';
    }
  }
})();

// ── Quiz flow ────────────────────────────────────────────────────
let quizQuestions = [];
let quizSettings = { quiz_passing_score: 70, quiz_max_attempts: 3 };
let quizAttempts = [];

async function initQuizFlow() {
  const [settings, attempts] = await Promise.all([
    Quiz.getSettings(courseId),
    Quiz.getAttempts(currentUser.id, courseId),
  ]);
  quizSettings = settings || quizSettings;
  quizAttempts = attempts;
  document.getElementById('quiz-summary').style.display = '';
  renderQuizSummary();
}

function renderQuizSummary() {
  const remaining = quizSettings.quiz_max_attempts - quizAttempts.length;
  const summaryEl = document.getElementById('quiz-summary-text');
  const btn = document.getElementById('quiz-start-btn');
  const attemptWord = quizAttempts.length > 0 ? 'Retake Quiz' : 'Start Quiz';

  summaryEl.innerHTML =
    `This course is completed by passing a quiz.<br>` +
    `<b>${quizQuestions.length} question${quizQuestions.length !== 1 ? 's' : ''}</b> · ` +
    `Passing score <b>${quizSettings.quiz_passing_score}%</b> · ` +
    `Attempts remaining: <b>${Math.max(0, remaining)}/${quizSettings.quiz_max_attempts}</b>`;

  if (remaining <= 0) {
    btn.disabled = true;
    btn.textContent = 'No attempts remaining';
    summaryEl.innerHTML += `<br><span style="color:var(--danger)">You've used all your attempts. Contact your administrator to reset them.</span>`;
  } else {
    btn.disabled = false;
    btn.textContent = attemptWord;
  }
}

function renderQuizForm() {
  const wrap = document.getElementById('quiz-main-section');
  wrap.innerHTML = `
    <div class="card card-body">
      <div class="card-title" style="margin-bottom:14px">Quiz — ${course.title}</div>
      <form id="quiz-form">
        ${quizQuestions.map((q, qi) => `
          <div style="margin-bottom:22px;padding-bottom:18px;${qi < quizQuestions.length - 1 ? 'border-bottom:1px solid var(--border-2)' : ''}">
            <div style="font-size:13.5px;font-weight:600;margin-bottom:10px">${qi + 1}. ${escHtml(q.question_text)}</div>
            ${q.options.map((opt, oi) => `
              <label style="display:flex;align-items:center;gap:9px;padding:6px 2px;cursor:pointer;font-size:13px">
                <input type="${q.type === 'multi' ? 'checkbox' : 'radio'}" name="quiz-q-${qi}" value="${oi}">
                ${escHtml(opt)}
              </label>`).join('')}
          </div>`).join('')}
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Submit Quiz</button>
      </form>
      <div id="quiz-result" style="display:none;margin-top:16px"></div>
    </div>`;
  document.getElementById('quiz-form').onsubmit = submitQuiz;
  wrap.style.display = '';
  wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function scrollToQuiz() { renderQuizForm(); }

async function submitQuiz(e) {
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true; submitBtn.textContent = 'Grading…';

  const answers = {};
  let correctCount = 0;
  quizQuestions.forEach((q, qi) => {
    const checked = Array.from(document.querySelectorAll(`input[name="quiz-q-${qi}"]:checked`)).map(el => parseInt(el.value));
    answers[q.id] = checked;
    const correct = [...q.correct_answers].sort().join(',') === [...checked].sort().join(',');
    if (correct) correctCount++;
  });

  const score = Math.round((correctCount / quizQuestions.length) * 100);
  const passed = score >= quizSettings.quiz_passing_score;
  const attemptNumber = quizAttempts.length + 1;

  try {
    await Quiz.recordAttempt(currentUser.id, courseId, attemptNumber, score, passed, answers);
    quizAttempts.push({ attempt_number: attemptNumber, score, passed });

    const resultEl = document.getElementById('quiz-result');
    document.getElementById('quiz-form').style.display = 'none';
    resultEl.style.display = '';

    if (passed) {
      enrollment = await Enrollments.updateProgress(currentUser.id, courseId, 'completed', 100);
      updateProgressUI();
      resultEl.innerHTML = `<div class="alert alert-success">🎉 You scored ${score}% — you passed! This course is now marked complete and your certificate has been issued.</div>`;
      toast('Quiz passed! Certificate issued. 🎉', 'success');
    } else {
      renderQuizSummary();
      const remaining = quizSettings.quiz_max_attempts - quizAttempts.length;
      resultEl.innerHTML = remaining > 0
        ? `<div class="alert alert-error">You scored ${score}% — the passing score is ${quizSettings.quiz_passing_score}%. You have ${remaining} attempt${remaining !== 1 ? 's' : ''} left.</div>
           <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px" onclick="renderQuizForm()">Try Again</button>`
        : `<div class="alert alert-error">You scored ${score}% — the passing score is ${quizSettings.quiz_passing_score}%. You've used all your attempts. Contact your administrator to reset them.</div>`;
    }
  } catch (err) {
    toast(err.message, 'error');
    submitBtn.disabled = false; submitBtn.textContent = 'Submit Quiz';
  }
}

// ── Progress UI ────────────────────────────────────────────────
function updateProgressUI() {
  if (!enrollment) return;
  const fill = document.getElementById('progress-fill');
  fill.style.width = (enrollment.progress || 0) + '%';
  fill.classList.toggle('done', enrollment.status === 'completed');

  if (enrollment.status === 'completed') {
    document.getElementById('progress-label').textContent = `Completed on ${fmtDate(enrollment.completed_at)}`;
    document.getElementById('completed-msg').style.display = '';
    document.getElementById('completed-date').textContent  = fmtDate(enrollment.completed_at);
    document.getElementById('no-quiz-msg').style.display = 'none';
    document.getElementById('quiz-summary').style.display = 'none';
    document.getElementById('cert-card').style.display = '';
  } else {
    document.getElementById('progress-label').textContent = enrollment.status === 'in_progress' ? 'In progress' : 'Not started';
  }
}

function downloadCertificate() {
  const firstName = (currentUser.name || currentUser.email).split(' ')[0];
  const date      = fmtDate(enrollment?.completed_at);
  const params    = new URLSearchParams({
    name:   firstName,
    course: course.title || '',
    date:   date || '',
    desc:   course.description
      ? `has successfully completed the <strong>${course.title}</strong> training program — ${course.description}`
      : '',
  });
  window.open(`certificate.html?${params.toString()}`, '_blank');
}

// ── Player ─────────────────────────────────────────────────────
async function renderPlayer(course) {
  const wrap = document.getElementById('player-wrap');

  if (course.content_type === 'youtube') {
    const videoId = extractYouTubeId(course.content_url);
    if (videoId) {
      wrap.innerHTML = `<div id="yt-player-div"></div>`;
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      window._ytVideoId = videoId;
      window.onYouTubeIframeAPIReady = () => {
        new YT.Player('yt-player-div', {
          videoId,
          width: '100%',
          height: '460',
          playerVars: { rel: 0, modestbranding: 1 },
        });
      };
      if (window.YT && window.YT.Player) window.onYouTubeIframeAPIReady();
      return;
    }
  }

  if (course.content_type === 'pdf') {
    wrap.innerHTML = `<iframe class="player-embed" src="${course.content_url}" style="height:600px"></iframe>`;
    return;
  }

  if (course.content_type === 'link') {
    wrap.innerHTML = `
      <div style="padding:40px;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">🔗</div>
        <p style="font-size:15px;color:var(--text-muted);margin-bottom:20px">This course opens in an external resource.</p>
        <a href="${course.content_url}" target="_blank" rel="noopener" class="btn btn-primary btn-lg">Open Content ↗</a>
        <p style="margin-top:16px;font-size:12px;color:var(--text-dim)">${course.content_url}</p>
      </div>`;
    return;
  }

  if (course.content_type === 'markdown' && course.content_url?.includes('github.com')) {
    wrap.innerHTML = `<div style="padding:24px;color:var(--text-muted);font-size:14px">Loading content from GitHub…</div>`;
    try {
      const md = await fetchGithubReadme(course.content_url);
      if (md) {
        wrap.innerHTML = `<div class="player-markdown" id="md-content">${markdownToHtml(md)}</div>`;
        return;
      }
    } catch {}
    wrap.innerHTML = `
      <div style="padding:40px;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">📂</div>
        <p style="color:var(--text-muted);margin-bottom:20px">Could not load content automatically. Open the repository directly:</p>
        <a href="${course.content_url}" target="_blank" rel="noopener" class="btn btn-primary btn-lg">Open on GitHub ↗</a>
      </div>`;
    return;
  }

  wrap.innerHTML = `
    <div style="padding:40px;text-align:center">
      <div style="font-size:48px;margin-bottom:16px">${course.icon || '📖'}</div>
      <h3 style="margin-bottom:8px">${course.title}</h3>
      <p style="color:var(--text-muted);margin-bottom:20px">${course.description || ''}</p>
      ${course.content_url ? `<a href="${course.content_url}" target="_blank" rel="noopener" class="btn btn-primary btn-lg">Open Content ↗</a>` : ''}
    </div>`;
}

function extractYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function contentTypeLabel(t) {
  return { markdown: 'GitHub Repo', pdf: 'PDF Document', youtube: 'Video', link: 'External Link' }[t] || t || 'Unknown';
}
</script>
</body>
</html>
